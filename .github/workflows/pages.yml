name: Deploy Git Workbench website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build website
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out website
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check Astro and TypeScript
        run: |
          set -o pipefail
          npm run check 2>&1 | tee "$RUNNER_TEMP/check.log"
      - name: Report check diagnostics
        if: failure()
        run: |
          if [ -s "$RUNNER_TEMP/check.log" ]; then
            while IFS= read -r line; do printf '::error::%s\n' "$line"; done < <(tail -n 30 "$RUNNER_TEMP/check.log")
          fi
      - name: Build static site
        run: npm run build
      - name: Run unit tests
        run: npm test
      - name: Verify built output
        run: npm run test:build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          retention-days: 1

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    name: Publish website
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
